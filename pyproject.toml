[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altitude"
version = "0.1.0"
description = "Evidence-first Snowflake diagnostics, observability, migration and run platform"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "sqlglot>=25",
  "pydantic>=2.6",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyarrow>=15",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
snowflake = ["snowflake-connector-python>=3.10"]

[project.scripts]
altitude = "altitude.cli:main"

[tool.setuptools.packages.find]
where = ["services", "connectors", "agents"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.json", "*.yaml", "*.html", "*.css", "*.js", "*.j2", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
