namespace: validation
version: 1.0.0
description: >
  Validation & reconciliation thresholds per table tier (Section 12.3), sampling, AI mismatch
  triage confidences and the accepted-deviation policy. The level matrix per tier lives in
  knowledge/validation/levels.yaml and references these values.
calibration:
  - date: "2026-10-01"
    note: Initial thresholds; Tier-1 keys require zero mismatches.
values:
  thresholds:
    tier1:
      l0_type_mismatch_max: 0
      l1_count_delta_max: 0
      l2_numeric_rel_tolerance: 0.0
      l2_float_rel_tolerance: 1.0e-9
      l3_mismatch_max: 0
      l3_mismatch_rate_max: 0.0
      l4_diff_rows_max: 0
      l4_numeric_rel_tolerance: 0.0
      l5_p50_ratio_max: 1.2
      l5_p95_ratio_max: 1.2
    tier2:
      l0_type_mismatch_max: 0
      l1_count_delta_max: 0
      l2_numeric_rel_tolerance: 1.0e-9
      l2_float_rel_tolerance: 1.0e-6
      l3_mismatch_max: 0
      l3_mismatch_rate_max: 0.0
      l4_diff_rows_max: 0
      l4_numeric_rel_tolerance: 1.0e-9
      l5_p50_ratio_max: 1.5
      l5_p95_ratio_max: 1.5
    tier3:
      l0_type_mismatch_max: 0
      l1_count_delta_max: 0
      l2_numeric_rel_tolerance: 1.0e-6
      l2_float_rel_tolerance: 1.0e-6
      l3_mismatch_max: 0
      l3_mismatch_rate_max: 0.0
      l4_diff_rows_max: 0
      l4_numeric_rel_tolerance: 1.0e-6
      l5_p50_ratio_max: 2.0
      l5_p95_ratio_max: 2.0
  sampling:
    l3_sample_rate: 0.10        # share of keys compared when L3 runs in "sample" mode
    l2_sample_partitions: 3     # most recent partitions aggregated when L2 runs in "sample" mode
  triage:
    max_keys_inspected: 500     # mismatched keys fetched in-boundary to derive root-cause signatures
    min_cluster_size: 2         # smaller clusters get the small-cluster factor
    small_cluster_factor: 0.85
    unmapped_dialect_factor: 0.7
    timestamp_precision_max_ms: 1000
    float_rel_tolerance: 1.0e-9     # float values this close are classified as float_precision drift
    signature_confidence:
      duplicate_rows: 0.93
      trailing_space: 0.95
      case_only: 0.93
      empty_vs_null: 0.95
      scale_truncation: 0.9
      timestamp_precision: 0.85
      time_component_lost: 0.92
      timezone_shift: 0.82
      float_precision: 0.8
      missing_rows: 0.6
      extra_rows: 0.6
      unexplained: 0.3
  deviation:
    review_by_max_days: 180     # accepted deviations must be re-reviewed within this window
