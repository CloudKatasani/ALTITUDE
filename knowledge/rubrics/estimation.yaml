namespace: estimation
version: 1.0.0
description: >
  Section 32 estimation rubric. Estimates = harvested evidence x factors, with p50/p80 and a confidence
  computed from data completeness — never a single number. All figures are seed values to be calibrated
  against actuals; ai_acceleration factors are hypotheses until measured.
calibration:
  - date: "2026-10-01"
    sample_size: 0
    note: Initial seed values from Section 32. Calibrate after the first 3-5 engagements.
values:
  unit_effort_hours:              # baseline per object after automated conversion
    table_ddl: 0.1
    view_simple: 0.25
    view_complex: 1.5
    procedure_per_100_loc: {low: 1.5, medium: 4, high: 10}
    bteq_script_per_100_loc: {low: 1, medium: 3, high: 8}
    etl_job: {passthrough: 1, transform: 6, complex: 24}
    report: {repoint: 0.5, rebuild: 8}
    schedule: 0.5                 # scheduler job re-pointed to tasks/orchestrator
    retire_object: 0.05           # decommission evidence per retired object
  view_complex_bands: [medium, high]
  etl_job_class_by_band: {low: passthrough, medium: transform, high: complex}
  multipliers:
    s1_issue_density: {per_issue: 0.5}          # hours per S1 occurrence
    test_coverage_absent: 1.3
    dynamic_sql_share: {threshold_ref: rubric.estimation.thresholds.dynamic_sql_high, factor: 1.25}
    ai_acceleration: {conversion: 0.6, test_generation: 0.5, documentation: 0.3}
  thresholds:
    dynamic_sql_high: 0.15        # share of code objects using dynamic SQL
  activity_shares:                # of conversion hours, before AI acceleration
    testing: 0.35
    documentation: 0.1
  fixed_activities_weeks:
    foundation: {small: 4, medium: 6, large: 10}
    parallel_run_cycles: 2
  foundation_size:                # by in-scope object count
    medium_min: 250
    large_min: 2500
  parallel_run_hours_per_cycle: 24
  team_hours_per_week: 160        # delivery capacity used to size waves (4 engineers x 40h)
  uncertainty:
    p80_base_spread: 0.2
    p80_incompleteness_spread: 0.6   # extra spread x (1 - confidence)
  confidence:
    weights: {usage_history: 0.25, code_coverage: 0.2, dependency_coverage: 0.2, classification: 0.2,
              programme_inputs: 0.15}
    usage_history_full_days: 365
    programme_inputs: [deadline_weeks, appetite_for_change, model_quality_score, budget_band, test_coverage]
