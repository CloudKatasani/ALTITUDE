# KPI catalogue — Cost & FinOps (Section 7.4). Every implemented KPI's `sql` runs over CURATED and returns
# ACCOUNT_NAME, PERIOD (date), DIMENSION (text, '' when none), VALUE (+ the listed `measures`).
# `${rubric.obs.x}` placeholders are substituted from the rubric at compute/generate time.
version: 1.0.0
kpis:
  - id: KPI-COST-001
    name: Credits by account, warehouse and day
    domain: cost
    tier: core
    status: implemented
    definition: >-
      Credits billed per warehouse and day: compute + cloud services credits from WAREHOUSE_METERING_HISTORY, with
      the account-day cloud-services adjustment from METERING_DAILY_HISTORY allocated pro rata to cloud-services use.
    unit: credits
    grain: [account, warehouse, day]
    dimension: warehouse
    aggregation: sum
    direction: lower_is_better
    sources: [WAREHOUSE_METERING_HISTORY, METERING_DAILY_HISTORY]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: PLATFORM_OWNER
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-01, DX-COST-02]
    synonyms: [credits, credit usage, warehouse credits, compute credits, consumption, burn]
    measures: [CREDITS_USED, CREDITS_USED_COMPUTE, CREDITS_USED_CLOUD_SERVICES]
    realised_value: {basis_kpi: KPI-COST-002}
    sql: >-
      SELECT ACCOUNT_NAME, DAY AS PERIOD, WAREHOUSE_NAME AS DIMENSION, CREDITS_BILLED AS VALUE, CREDITS_USED,
             CREDITS_USED_COMPUTE, CREDITS_USED_CLOUD_SERVICES
      FROM CURATED.FACT_WAREHOUSE_DAILY

  - id: KPI-COST-002
    name: Spend ($) by warehouse and day
    domain: cost
    tier: core
    status: implemented
    definition: KPI-COST-001 credits billed multiplied by the contract price per credit (client input).
    unit: usd
    grain: [account, warehouse, day]
    dimension: warehouse
    aggregation: sum
    direction: lower_is_better
    sources: [WAREHOUSE_METERING_HISTORY, METERING_DAILY_HISTORY, CLIENT_INPUTS]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: PLATFORM_OWNER
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-01, DX-COST-02]
    synonyms: [spend, cost, dollars, money, warehouse cost, how much did we spend]
    measures: [CREDITS_BILLED, PRICE_PER_CREDIT]
    realised_value: {basis_kpi: KPI-COST-002}
    sql: >-
      SELECT d.ACCOUNT_NAME, d.DAY AS PERIOD, d.WAREHOUSE_NAME AS DIMENSION, d.CREDITS_BILLED * a.PRICE_PER_CREDIT AS VALUE,
             d.CREDITS_BILLED, a.PRICE_PER_CREDIT
      FROM CURATED.FACT_WAREHOUSE_DAILY d JOIN CURATED.DIM_ACCOUNT a ON a.ACCOUNT_NAME = d.ACCOUNT_NAME

  - id: KPI-COST-003
    name: Cost by cost centre
    domain: cost
    tier: core
    status: implemented
    definition: >-
      Daily billed cost ($) by cost centre: warehouse spend by the warehouse's cost-centre tag; serverless, AI and
      untagged warehouse spend fall into UNALLOCATED. Sums to total billed spend (KPI-COST-011).
    unit: usd
    grain: [account, cost_centre, day]
    dimension: cost_centre
    aggregation: sum
    direction: neutral
    sources: [WAREHOUSE_METERING_HISTORY, METERING_DAILY_HISTORY, TAG_REFERENCES, CLIENT_INPUTS]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: FINOPS_LEAD
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-07]
    synonyms: [cost centre, cost center, chargeback, showback, department, business unit, tag]
    measures: [CREDITS_BILLED]
    sql: >-
      WITH c AS (
        SELECT ACCOUNT_NAME, DAY, coalesce(COST_CENTRE, 'UNALLOCATED') AS COST_CENTRE, CREDITS_BILLED
        FROM CURATED.FACT_WAREHOUSE_DAILY
        UNION ALL
        SELECT ACCOUNT_NAME, DAY, 'UNALLOCATED', CREDITS_BILLED FROM CURATED.FACT_METERING_DAILY
        WHERE SERVICE_TYPE <> 'WAREHOUSE_METERING')
      SELECT c.ACCOUNT_NAME, c.DAY AS PERIOD, c.COST_CENTRE AS DIMENSION, sum(c.CREDITS_BILLED) * max(a.PRICE_PER_CREDIT) AS VALUE,
             sum(c.CREDITS_BILLED) AS CREDITS_BILLED
      FROM c JOIN CURATED.DIM_ACCOUNT a ON a.ACCOUNT_NAME = c.ACCOUNT_NAME
      GROUP BY c.ACCOUNT_NAME, c.DAY, c.COST_CENTRE

  - id: KPI-COST-004
    name: Month-on-month spend trend
    domain: cost
    tier: core
    status: implemented
    definition: >-
      Percent change in average daily billed spend versus the previous calendar month (average daily spend makes
      partial months comparable).
    unit: percent
    grain: [account, month]
    dimension: none
    aggregation: latest
    direction: lower_is_better
    sources: [METERING_DAILY_HISTORY, CLIENT_INPUTS]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: FINOPS_LEAD
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-08]
    synonyms: [month on month, mom, trend, growth, compared to last month, monthly trend]
    measures: [MONTH_USD, AVG_DAILY_USD, PREV_AVG_DAILY_USD, DAYS]
    sql: >-
      WITH m AS (
        SELECT f.ACCOUNT_NAME, CAST(date_trunc('month', f.DAY) AS DATE) AS MONTH,
               sum(f.CREDITS_BILLED) * max(a.PRICE_PER_CREDIT) AS MONTH_USD, count(DISTINCT f.DAY) AS DAYS
        FROM CURATED.FACT_METERING_DAILY f JOIN CURATED.DIM_ACCOUNT a ON a.ACCOUNT_NAME = f.ACCOUNT_NAME
        GROUP BY 1, 2),
      t AS (SELECT ACCOUNT_NAME, MONTH, MONTH_USD, DAYS, MONTH_USD / DAYS AS AVG_DAILY_USD,
                   lag(MONTH_USD / DAYS) OVER (PARTITION BY ACCOUNT_NAME ORDER BY MONTH) AS PREV_AVG_DAILY_USD
            FROM m)
      SELECT ACCOUNT_NAME, MONTH AS PERIOD, '' AS DIMENSION,
             CASE WHEN PREV_AVG_DAILY_USD > 0 THEN (AVG_DAILY_USD / PREV_AVG_DAILY_USD - 1) * 100 END AS VALUE,
             MONTH_USD, AVG_DAILY_USD, PREV_AVG_DAILY_USD, DAYS
      FROM t

  - id: KPI-COST-005
    name: Forecast vs budget
    domain: cost
    tier: core
    status: implemented
    definition: >-
      Month-end forecast of billed credits (month-to-date run rate x days in month) divided by the account budget's
      monthly spending limit (credits). Above 1.0 the month is forecast to overrun.
    unit: ratio
    grain: [account, month]
    dimension: none
    aggregation: latest
    direction: lower_is_better
    sources: [METERING_DAILY_HISTORY, BUDGETS]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: FINOPS_LEAD
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-08, DX-OPS-02]
    synonyms: [forecast, budget, overrun, on track, projection, run rate]
    measures: [MTD_CREDITS, FORECAST_CREDITS, BUDGET_CREDITS, DAYS_ELAPSED, DAYS_IN_MONTH]
    sql: >-
      WITH m AS (
        SELECT ACCOUNT_NAME, CAST(date_trunc('month', DAY) AS DATE) AS MONTH, sum(CREDITS_BILLED) AS MTD_CREDITS,
               max(DAY) AS LAST_DAY_SEEN
        FROM CURATED.FACT_METERING_DAILY GROUP BY 1, 2),
      b AS (SELECT ACCOUNT_NAME, sum(SPENDING_LIMIT) AS BUDGET_CREDITS FROM CURATED.SNAP_BUDGETS
            WHERE IS_LATEST AND SCOPE = 'ACCOUNT' GROUP BY 1)
      SELECT m.ACCOUNT_NAME, m.MONTH AS PERIOD, '' AS DIMENSION,
             CASE WHEN b.BUDGET_CREDITS > 0 THEN
               (m.MTD_CREDITS / (date_diff('day', m.MONTH, m.LAST_DAY_SEEN) + 1) * dayofmonth(last_day(m.MONTH))) / b.BUDGET_CREDITS
             END AS VALUE,
             m.MTD_CREDITS,
             m.MTD_CREDITS / (date_diff('day', m.MONTH, m.LAST_DAY_SEEN) + 1) * dayofmonth(last_day(m.MONTH)) AS FORECAST_CREDITS,
             b.BUDGET_CREDITS, date_diff('day', m.MONTH, m.LAST_DAY_SEEN) + 1 AS DAYS_ELAPSED,
             dayofmonth(last_day(m.MONTH)) AS DAYS_IN_MONTH
      FROM m LEFT JOIN b ON b.ACCOUNT_NAME = m.ACCOUNT_NAME

  - id: KPI-COST-006
    name: Cost per query signature
    domain: cost
    tier: extended
    status: implemented
    definition: Compute credits attributed to each parameterised query signature per day, in dollars.
    unit: usd
    grain: [account, query_signature, day]
    dimension: query_signature
    aggregation: sum
    direction: lower_is_better
    sources: [QUERY_ATTRIBUTION_HISTORY, QUERY_HISTORY, CLIENT_INPUTS]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: PLATFORM_OWNER
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-03, DX-PERF-04]
    synonyms: [query signature, expensive queries, query cost, top queries, costliest queries]
    measures: [CREDITS, EXECUTIONS, USD_PER_EXECUTION]
    realised_value: {basis_kpi: KPI-COST-006}
    sql: >-
      SELECT q.ACCOUNT_NAME, q.DAY AS PERIOD, q.SIGNATURE AS DIMENSION,
             sum(q.CREDITS_ATTRIBUTED_COMPUTE) * max(a.PRICE_PER_CREDIT) AS VALUE, sum(q.CREDITS_ATTRIBUTED_COMPUTE) AS CREDITS,
             count(*) AS EXECUTIONS, sum(q.CREDITS_ATTRIBUTED_COMPUTE) * max(a.PRICE_PER_CREDIT) / count(*) AS USD_PER_EXECUTION
      FROM CURATED.FACT_QUERY q JOIN CURATED.DIM_ACCOUNT a ON a.ACCOUNT_NAME = q.ACCOUNT_NAME
      GROUP BY q.ACCOUNT_NAME, q.DAY, q.SIGNATURE

