  - id: KPI-COST-012
    name: Storage cost per month
    domain: cost
    tier: extended
    status: implemented
    definition: Average stored TB (database + stage + fail-safe + hybrid) in the month x contract storage price per TB-month.
    unit: usd
    grain: [account, month]
    dimension: none
    aggregation: latest
    direction: lower_is_better
    sources: [STORAGE_USAGE, CLIENT_INPUTS]
    freshness_sla_ref: rubric.obs.freshness.governance
    owner_role: FINOPS_LEAD
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-06]
    synonyms: [storage cost, storage spend, storage bill]
    measures: [AVG_TB]
    sql: >-
      SELECT s.ACCOUNT_NAME, CAST(date_trunc('month', s.DAY) AS DATE) AS PERIOD, '' AS DIMENSION,
             avg((s.STORAGE_BYTES + s.STAGE_BYTES + s.FAILSAFE_BYTES + coalesce(s.HYBRID_TABLE_STORAGE_BYTES, 0)) / power(1024, 4))
               * max(a.STORAGE_PRICE_PER_TB_MONTH) AS VALUE,
             avg((s.STORAGE_BYTES + s.STAGE_BYTES + s.FAILSAFE_BYTES + coalesce(s.HYBRID_TABLE_STORAGE_BYTES, 0)) / power(1024, 4)) AS AVG_TB
      FROM CURATED.FACT_STORAGE_DAILY s JOIN CURATED.DIM_ACCOUNT a ON a.ACCOUNT_NAME = s.ACCOUNT_NAME
      GROUP BY 1, 2

  - id: KPI-COST-013
    name: Capacity commitment burn-down
    domain: cost
    tier: advanced
    status: implemented
    definition: >-
      Cumulative billed credits since the commitment start / annual committed credits, per day; compare with
      EXPECTED_SHARE (elapsed share of the commitment term).
    unit: ratio
    grain: [account, day]
    dimension: none
    aggregation: latest
    direction: neutral
    sources: [METERING_DAILY_HISTORY, CLIENT_INPUTS]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: FINOPS_LEAD
    waf_pillar: cost_optimization
    linked_checks: [DX-COST-08]
    synonyms: [commitment, capacity, burn down, contract, prepaid credits]
    measures: [CONSUMED_CREDITS, ANNUAL_COMMIT_CREDITS, EXPECTED_SHARE]
    sql: >-
      WITH d AS (SELECT ACCOUNT_NAME, DAY, sum(CREDITS_BILLED) AS CREDITS FROM CURATED.FACT_METERING_DAILY GROUP BY 1, 2)
      SELECT d.ACCOUNT_NAME, d.DAY AS PERIOD, '' AS DIMENSION,
             sum(d.CREDITS) OVER (PARTITION BY d.ACCOUNT_NAME ORDER BY d.DAY) / a.ANNUAL_COMMIT_CREDITS AS VALUE,
             sum(d.CREDITS) OVER (PARTITION BY d.ACCOUNT_NAME ORDER BY d.DAY) AS CONSUMED_CREDITS, a.ANNUAL_COMMIT_CREDITS,
             (date_diff('day', a.COMMIT_START, d.DAY) + 1) / (date_diff('day', a.COMMIT_START, a.COMMIT_END) + 1) AS EXPECTED_SHARE
      FROM d JOIN CURATED.DIM_ACCOUNT a ON a.ACCOUNT_NAME = d.ACCOUNT_NAME
      WHERE a.ANNUAL_COMMIT_CREDITS > 0 AND d.DAY >= a.COMMIT_START

