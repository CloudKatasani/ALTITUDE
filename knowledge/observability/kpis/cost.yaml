  - id: KPI-COST-020
    name: Resource monitor coverage
    domain: cost
    tier: extended
    status: implemented
    definition: Share of warehouses with a resource monitor attached, per snapshot day.
    unit: ratio
    grain: [account, day]
    dimension: none
    aggregation: latest
    direction: higher_is_better
    sources: [WAREHOUSES]
    freshness_sla_ref: rubric.obs.freshness.cost
    owner_role: PLATFORM_OWNER
    waf_pillar: cost_optimization
    linked_checks: [DX-OPS-02]
    synonyms: [resource monitor, monitor coverage, quota]
    sql: >-
      SELECT ACCOUNT_NAME, SNAPSHOT_DATE AS PERIOD, '' AS DIMENSION,
             avg(CASE WHEN RESOURCE_MONITOR IS NOT NULL THEN 1.0 ELSE 0.0 END) AS VALUE
      FROM CURATED.SNAP_WAREHOUSES GROUP BY 1, 2
