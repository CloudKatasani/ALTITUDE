name: recommend_pattern
description: Recommend the migration pattern (lift-and-shift, re-engineer, ...) for the programme or a set of objects, from
  evidence and programme inputs, with dissent.
permission: run
entrypoint: altitude.skills.impl_planning:recommend_pattern
input_schema:
  type: object
  properties:
    assessment_snapshot_id:
      type: string
      minLength: 3
      description: assessment snapshot id or path
    harvest_snapshot_id:
      type: string
      minLength: 3
      description: harvest snapshot id or path (assessed on demand)
    inputs:
      type: object
      description: 'programme inputs (Appendix B): deadline_weeks, start_date, appetite_for_change, ...'
    object_ids:
      type: array
      items:
        type: string
    names:
      type: array
      items:
        type: string
  additionalProperties: false
