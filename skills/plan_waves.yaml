name: plan_waves
description: Plan migration waves under the wave rules (dependencies, consumables, hubs, freezes) with dates, patterns and
  p50/p80 estimates; records the plan.
permission: run
entrypoint: altitude.skills.impl_planning:plan_waves
input_schema:
  type: object
  properties:
    assessment_snapshot_id:
      type: string
      minLength: 3
      description: assessment snapshot id or path
    harvest_snapshot_id:
      type: string
      minLength: 3
      description: harvest snapshot id or path (assessed on demand)
    inputs:
      type: object
      description: 'programme inputs (Appendix B): deadline_weeks, start_date, appetite_for_change, ...'
    record:
      type: boolean
  additionalProperties: false
